name: Deploy dev preview

# Pushes to `dev` build and publish to the `gh-pages-dev` branch, which
# GitHub Pages can serve as a separate preview site. `main` is untouched
# and keeps deploying to `gh-pages` for production.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run check:hooks
          npm run typecheck
          npm run lint

      - name: Build
        env:
          VITE_BASE: /anniversary-dev/
        run: npm run build

      - name: Deploy to gh-pages-dev
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages-dev
          publish_dir: ./dist
